services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziraat
      POSTGRES_PASSWORD: Ziraat2026DbPassword
      POSTGRES_DB: ziraat_irrigation
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziraat -d ziraat_irrigation"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ziraat:Ziraat2026DbPassword@db:5432/ziraat_irrigation
    ports:
      - "8000:8000"
    volumes:
      - appdata:/srv/data

volumes:
  pgdata:
  appdata:
